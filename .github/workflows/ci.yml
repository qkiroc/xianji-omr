name: Verify application
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci
      - name: Use matching PostgreSQL test tools
        run: |
          echo "$PWD/node_modules/@embedded-postgres/linux-x64/native/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/node_modules/@embedded-postgres/linux-x64/native/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - run: pg_dump --version
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Install browser for UI acceptance
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify review workflow in Chromium
        run: node test/review-browser.mjs
      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-ui-screenshots
          path: .test-data/review-browser
          if-no-files-found: ignore
          include-hidden-files: true
