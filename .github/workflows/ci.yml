name: Verify application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci
      - name: Use PostgreSQL 18 backup tools
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --show-error --silent -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-18
          fi
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version
      - run: npm run typecheck
      - run: npm run build
        id: build
      - name: Reserve isolated database test ports
        run: |
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}55430-55520"
      - run: npm test
      - name: Install browser for UI acceptance
        id: browser_install
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/omr-browser-tools" --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.55.0
          echo "OMR_PLAYWRIGHT_MODULE=$RUNNER_TEMP/omr-browser-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "OMR_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/omr-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Verify review workflow in Chromium
        if: ${{ !cancelled() && steps.browser_install.outcome == 'success' }}
        run: node test/review-browser.mjs
      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-ui-screenshots
          path: .test-data/review-browser
          if-no-files-found: ignore
          include-hidden-files: true
