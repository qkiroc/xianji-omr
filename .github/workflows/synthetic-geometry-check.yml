name: Verify synthetic glyph geometry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/synthetic/music-region-geometry.mjs'
      - 'tools/synthetic/install-renderer.mjs'
      - 'tools/synthetic/verify-music-geometry.mjs'
      - '.github/workflows/synthetic-geometry-check.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    env:
      OMR_ASSET_KEY: ${{ secrets.OMR_ASSET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore encrypted score inputs
        run: node tools/synthetic/bootstrap-cloud.mjs
      - name: Install pinned renderer and fonts
        run: |
          npm ci --prefix .artifacts/synthetic-renderer --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-arphic-ukai fonts-arphic-uming fonts-liberation
          node .artifacts/synthetic-renderer/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Render and verify all three editions of six regression songs
        run: node tools/synthetic/verify-music-geometry.mjs

      - name: Stop superseded production after geometry passes and verify checkpoint preservation
        if: contains(github.event.head_commit.message, '[replace-run:40185285921]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=40185285921
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous" --jq '.status')
          if [[ "$status" != 'completed' ]]; then gh run cancel "$previous" --repo "$GITHUB_REPOSITORY"; fi
          for attempt in $(seq 1 90); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous/artifacts" --jq '[.artifacts[] | select(.name=="synthetic-checkpoint" and .expired==false)] | length')
            if [[ "$count" -gt 0 ]]; then echo "Latest checkpoint from superseded production is preserved."; exit 0; fi
            sleep 2
          done
          echo 'No checkpoint was preserved. The replacement requires this exact checkpoint and will stop during restore.'
          exit 1
