name: Verify synthetic glyph geometry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/synthetic/music-region-geometry.mjs'
      - 'tools/synthetic/install-renderer.mjs'
      - 'tools/synthetic/verify-music-geometry.mjs'
      - '.github/workflows/synthetic-geometry-check.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMR_ASSET_KEY: ${{ secrets.OMR_ASSET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore encrypted score inputs
        run: node tools/synthetic/bootstrap-cloud.mjs
      - name: Install pinned renderer and fonts
        run: |
          npm ci --prefix .artifacts/synthetic-renderer --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-arphic-ukai fonts-arphic-uming fonts-liberation
          node .artifacts/synthetic-renderer/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Render and verify all three editions of six regression songs
        run: node tools/synthetic/verify-music-geometry.mjs
